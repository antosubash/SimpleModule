<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>We&rsquo;ll be right back</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            html,
            body {
                height: 100%;
                margin: 0;
            }
            body {
                font-family:
                    system-ui,
                    -apple-system,
                    Segoe UI,
                    Roboto,
                    sans-serif;
                background: #fafafa;
                color: #1a1a1a;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1.5rem;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background: #0b0b0c;
                    color: #f5f5f5;
                }
            }
            .card {
                max-width: 32rem;
                text-align: center;
            }
            h1 {
                font-size: 1.875rem;
                margin: 0 0 0.5rem;
            }
            p {
                color: #555;
                margin: 0 0 1rem;
                line-height: 1.5;
            }
            @media (prefers-color-scheme: dark) {
                p {
                    color: #bbb;
                }
            }
            .status {
                font-size: 0.75rem;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: #888;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="status">503 &middot; Service Unavailable</div>
            <h1>We&rsquo;ll be right back</h1>
            <p>The application is undergoing scheduled maintenance. Please check back shortly.</p>
        </div>
    </body>
</html>
